name: Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  NODE_VERSION: "24"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            name: windows-x64

          - platform: macos-arm64
            os: macos-15
            name: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python (for ai-service)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Install server dependencies
        run: |
          cd server
          npm ci

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Test server
        run: npm --prefix server test -- --runInBand

      - name: Test desktop
        run: npm --prefix desktop test

      - name: Build client
        run: |
          cd client
          npm run build

      - name: Build ai-service (Unix)
        if: matrix.platform != 'windows'
        run: |
          cd ai-service
          chmod +x scripts/build-ai-service.sh
          ./scripts/build-ai-service.sh

      - name: Build ai-service (Windows)
        if: matrix.platform == 'windows'
        run: |
          cd ai-service
          scripts\build-ai-service.bat

      - name: Build desktop app (Windows)
        if: matrix.platform == 'windows'
        run: |
          cd desktop
          npm run generate:icons
          npm run prepare:resources
          npx electron-builder --win --x64

      - name: Build desktop app (macOS ARM64)
        if: matrix.platform == 'macos-arm64'
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: |
          cd desktop
          npm run generate:icons
          npm run prepare:resources
          npx electron-builder --mac --arm64

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: Tidy-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: Tidy-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
